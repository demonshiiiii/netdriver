# Discovery ingest mapping rules keyed by normalized field name.
#
# Example:
# vendor:
#   - source: "cisco"
#     target: "Cisco"
#
# model:
#   - source: "n9k"
#     target: "N9K"
#
# device_type:
#   - source: "switch"
#     target: "Switch"
vendor:
  - source: "juniper"
    target: "JUNIPER"

  - source: "fortinet"
    target: "FORTINET"
